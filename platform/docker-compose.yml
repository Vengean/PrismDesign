version: "3.8"

services:
  platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    # Linux deployment: gateway listeners and loopback-only container ports share the host network.
    network_mode: host
    volumes:
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - platform-data:/data
    environment:
      - PRISM_DATA_DIR=/data
      - PRISM_PREVIEW_HOST=${PRISM_PREVIEW_HOST:-}
      - CONTAINER_SOCKET=/var/run/docker.sock
      - PRISM_WORKSPACE_IMAGE=${PRISM_WORKSPACE_IMAGE:-prism-workspace:latest}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    restart: unless-stopped

volumes:
  platform-data:
